upstream taskmanager_backend {
    server app_prod:5000;
}

server {
    listen 80;
    server_name _;

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Proxy hacia Flask ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://taskmanager_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Desactivar buffer para SSE / streaming (futuro)
        proxy_buffering    off;
    }

    # ── Archivos estáticos servidos directamente por Nginx ────────────────────
    location /static/ {
        proxy_pass http://taskmanager_backend/static/;
        expires    7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check sin log ──────────────────────────────────────────────────
    location /api/health {
        proxy_pass http://taskmanager_backend/api/health;
        access_log off;
    }

    # ── Bloquear acceso a rutas sensibles ────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
