networks:
  tasknet:
    driver: bridge

volumes:
  data_dev:
  data_test:
  data_prod:

# ─────────────────────────────────────────────────────────────────────────────
# AMBIENTE DEVELOPMENT  →  docker compose --profile dev up
# ─────────────────────────────────────────────────────────────────────────────
services:

  app_dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: taskmanager:dev
    container_name: taskmanager_dev
    env_file: .env.dev
    ports:
      - "5000:5000"
    volumes:
      - data_dev:/data
      # Bind-mount del código para hot-reload en desarrollo
      - ./app:/app/app
      - ./run.py:/app/run.py
    networks: [tasknet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 20s
      timeout: 8s
      start_period: 5s
      retries: 3

# ─────────────────────────────────────────────────────────────────────────────
# AMBIENTE TEST  →  docker compose --profile test up
# ─────────────────────────────────────────────────────────────────────────────

  app_test:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: taskmanager:test
    container_name: taskmanager_test
    env_file: .env.test
    ports:
      - "5001:5000"
    volumes:
      - data_test:/data
    networks: [tasknet]
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 15s
      timeout: 8s
      start_period: 5s
      retries: 3

# ─────────────────────────────────────────────────────────────────────────────
# AMBIENTE PRODUCTION  →  docker compose --profile prod up
# App detrás de Nginx, sin puertos directos expuestos al exterior
# ─────────────────────────────────────────────────────────────────────────────

  app_prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: taskmanager:prod
    container_name: taskmanager_prod
    env_file: .env.prod
    # No expone puerto directamente; el tráfico entra por nginx
    expose:
      - "5000"
    volumes:
      - data_prod:/data
    networks: [tasknet]
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  nginx:
    profiles: [prod]
    image: nginx:1.27-alpine
    container_name: taskmanager_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app_prod:
        condition: service_healthy
    networks: [tasknet]
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
